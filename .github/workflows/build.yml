name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a Release on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests + debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/debug/app-debug.apk "CinemanaDM-${VER}-debug.apk"
          echo "APK=CinemanaDM-${VER}-debug.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: cinemanadm-debug-apk
          path: ${{ env.APK }}

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
